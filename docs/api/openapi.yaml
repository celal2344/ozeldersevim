openapi: 3.1.0
info:
  title: Ozel Ders Evim API
  version: 0.1.0
  description: MVP API contract. Feature branches must update this file with implemented endpoints.
servers:
  - url: /api
paths:
  /search/teachers:
    get:
      summary: Search published teacher listings
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SearchQueryParam"
        - $ref: "#/components/parameters/TeacherSortParam"
        - $ref: "#/components/parameters/LessonFilterParam"
        - $ref: "#/components/parameters/CityFilterParam"
        - $ref: "#/components/parameters/DistrictFilterParam"
        - $ref: "#/components/parameters/DeliveryModeFilterParam"
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lng
          schema:
            type: number
      responses:
        "200":
          description: Paginated teacher search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherSearchResponse"
  /teachers/{slug}:
    get:
      summary: Get a public teacher profile by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          description: Teacher profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lesson-requests/complete-with-account:
    post:
      summary: Create a student account and submit a lesson request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLessonRequestPayload"
      responses:
        "200":
          description: Lesson request submitted and attached to the new student account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteLessonRequestResponse"
        "400":
          description: Invalid request payload or unsupported teacher/lesson/delivery choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Teacher, lesson category, or location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Supabase signup did not return a session because email confirmation is enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teacher-eligibility/attempts:
    post:
      summary: Score the fixed MVP teacher eligibility test without persisting failed attempts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherEligibilityAttemptPayload"
      responses:
        "200":
          description: Test score result. Correct answers are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherEligibilityResult"
        "400":
          description: Invalid or incomplete test payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teachers/onboarding:
    post:
      summary: Create an active teacher account, passed test attempt, teacher profile, lessons, and published listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherOnboardingPayload"
      responses:
        "200":
          description: Teacher account and listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherOnboardingResponse"
        "400":
          description: Invalid request payload, failed eligibility test, or Supabase signup error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Active teacher test, location, or lesson category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Supabase signup did not return a session because email confirmation is enabled, or listing slug conflict remains
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    PageParam:
      in: query
      name: page
      description: 1-based page number for list endpoints.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      in: query
      name: pageSize
      description: Number of records per page. List endpoints may choose a smaller default.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    SearchQueryParam:
      in: query
      name: q
      description: Free-text search query.
      schema:
        type: string
    SortParam:
      in: query
      name: sort
      description: Endpoint-specific sort key.
      schema:
        type: string
    OrderParam:
      in: query
      name: order
      description: Sort direction for list endpoints that support generic ordering.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    TeacherSortParam:
      in: query
      name: sort
      description: Teacher search sort key.
      schema:
        type: string
        enum: [recommended, nearest, highest_rated, lowest_price, most_reviewed]
        default: recommended
    LessonFilterParam:
      in: query
      name: lesson
      description: Lesson/category slug or search value.
      schema:
        type: string
    CityFilterParam:
      in: query
      name: city
      description: City filter.
      schema:
        type: string
    DistrictFilterParam:
      in: query
      name: district
      description: District filter.
      schema:
        type: string
    DeliveryModeFilterParam:
      in: query
      name: deliveryMode
      description: Online, face-to-face, or all delivery modes.
      schema:
        type: string
        enum: [all, online, face_to_face, both]
        default: all
  schemas:
    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ListMeta:
      type: object
      required: [total, page, pageSize, totalPages]
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        sort:
          type: string
        order:
          type: string
          enum: [asc, desc]
        filters:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: boolean
    PaginatedResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: "#/components/schemas/ListMeta"
    TeacherSearchResponse:
      allOf:
        - $ref: "#/components/schemas/PaginatedResponse"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/TeacherSearchResult"
    TeacherSearchResult:
      type: object
      required:
        - id
        - slug
        - fullName
        - headline
        - shortBio
        - city
        - district
        - latitude
        - longitude
        - lessons
        - deliveryMode
        - hourlyPrice
        - ratingAverage
        - reviewCount
        - experienceYears
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        fullName:
          type: string
        headline:
          type: string
        shortBio:
          type: string
        city:
          type: string
        district:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        lessons:
          type: array
          items:
            type: string
        deliveryMode:
          type: string
          enum: [online, face_to_face, both]
        hourlyPrice:
          type: number
        ratingAverage:
          type: number
        reviewCount:
          type: integer
        experienceYears:
          type: integer
        distanceKm:
          type: number
    TeacherProfileReview:
      type: object
      required: [id, studentName, rating, comment, createdAt]
      properties:
        id:
          type: string
          format: uuid
        studentName:
          type: string
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date
    TeacherProfile:
      allOf:
        - $ref: "#/components/schemas/TeacherSearchResult"
        - type: object
          required:
            - title
            - longBio
            - education
            - responseTime
            - activeStudentCount
            - completedLessonCount
            - isVerified
            - lessonDurationMinutes
            - reviews
          properties:
            title:
              type: string
            longBio:
              type: string
            education:
              type: string
            responseTime:
              type: string
            activeStudentCount:
              type: integer
            completedLessonCount:
              type: integer
            isVerified:
              type: boolean
            lessonDurationMinutes:
              type: integer
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/TeacherProfileReview"
    CompleteLessonRequestPayload:
      type: object
      required:
        - teacherSlug
        - lessonSlug
        - locationSlug
        - deliveryMode
        - studentLevel
        - goal
        - studentName
        - email
        - phone
        - contactPreference
        - termsAccepted
        - privacyAccepted
        - password
      properties:
        teacherSlug:
          type: string
        lessonSlug:
          type: string
        locationSlug:
          type: string
        deliveryMode:
          type: string
          enum: [online, face_to_face]
        studentLevel:
          type: string
        goal:
          type: string
        budgetMin:
          type: string
        budgetMax:
          type: string
        studentName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        contactPreference:
          type: string
          enum: [phone, both]
        termsAccepted:
          type: boolean
          enum: [true]
        privacyAccepted:
          type: boolean
          enum: [true]
        password:
          type: string
          minLength: 8
    CompleteLessonRequestResponse:
      type: object
      required: [requestId, studentProfileId, status]
      properties:
        requestId:
          type: string
          format: uuid
        studentProfileId:
          type: string
          format: uuid
        status:
          type: string
          enum: [submitted]
    TeacherEligibilityAnswer:
      type: object
      required: [questionId, optionId]
      properties:
        questionId:
          type: string
        optionId:
          type: string
    TeacherEligibilityAttemptPayload:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/TeacherEligibilityAnswer"
    TeacherEligibilityResult:
      type: object
      required: [passed, score, passingScore, questionCount, correctCount]
      properties:
        passed:
          type: boolean
        score:
          type: integer
          minimum: 0
          maximum: 100
        passingScore:
          type: integer
          enum: [70]
        questionCount:
          type: integer
          enum: [10]
        correctCount:
          type: integer
          minimum: 0
          maximum: 10
    TeacherOnboardingPayload:
      type: object
      required:
        - eligibilityAnswers
        - fullName
        - email
        - password
        - phone
        - locationSlug
        - hourlyPrice
        - title
        - bio
        - lessonSlugs
        - education
        - experienceYears
        - deliveryMode
        - termsAccepted
        - privacyAccepted
      properties:
        eligibilityAnswers:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/TeacherEligibilityAnswer"
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        phone:
          type: string
        locationSlug:
          type: string
        hourlyPrice:
          type: number
        title:
          type: string
        bio:
          type: string
          minLength: 40
        lessonSlugs:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
        education:
          type: string
        experienceYears:
          type: integer
          minimum: 0
        deliveryMode:
          type: string
          enum: [online, face_to_face, both]
        termsAccepted:
          type: boolean
          enum: [true]
        privacyAccepted:
          type: boolean
          enum: [true]
    TeacherOnboardingResponse:
      type: object
      required: [teacherProfileId, listingSlug, status]
      properties:
        teacherProfileId:
          type: string
          format: uuid
        listingSlug:
          type: string
        status:
          type: string
          enum: [published]
