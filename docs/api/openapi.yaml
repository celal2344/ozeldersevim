openapi: 3.1.0
info:
  title: Ozel Ders Evim API
  version: 0.1.0
  description: MVP API contract. Feature branches must update this file with implemented endpoints.
servers:
  - url: /api
paths:
  /auth/register:
    post:
      summary: Register a student or teacher account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPayload"
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid payload or signup error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Signup did not return a session because email confirmation is enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
  /auth/login:
    post:
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginPayload"
      responses:
        "200":
          description: Signed in account and redirect target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials or missing app profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
  /auth/forgot-password:
    post:
      summary: Send a password reset email without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset request accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
  /auth/logout:
    post:
      summary: Sign out the current account
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "500":
          description: Logout failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      summary: Get the current signed-in account
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/AuthAccount"
        "401":
          description: No current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /search/teachers:
    get:
      summary: Search published teacher listings
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/PageSizeParam"
        - $ref: "#/components/parameters/SearchQueryParam"
        - $ref: "#/components/parameters/TeacherSortParam"
        - $ref: "#/components/parameters/LessonFilterParam"
        - $ref: "#/components/parameters/CityFilterParam"
        - $ref: "#/components/parameters/DistrictFilterParam"
        - $ref: "#/components/parameters/DeliveryModeFilterParam"
        - in: query
          name: availabilityWeekday
          schema:
            type: integer
            minimum: 1
            maximum: 7
        - in: query
          name: availabilityStartHour
          schema:
            type: integer
            minimum: 0
            maximum: 23
        - in: query
          name: availabilityEndHour
          schema:
            type: integer
            minimum: 1
            maximum: 24
        - in: query
          name: lat
          schema:
            type: number
        - in: query
          name: lng
          schema:
            type: number
      responses:
        "200":
          description: Paginated teacher search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherSearchResponse"
  /lesson-categories:
    get:
      summary: List active lesson categories
      responses:
        "200":
          description: Active lesson categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/LessonCategoryOption"
  /locations:
    get:
      summary: List supported city and district locations
      responses:
        "200":
          description: Supported locations
          content:
            application/json:
              schema:
                type: object
                required: [locations]
                properties:
                  locations:
                    type: array
                    items:
                      $ref: "#/components/schemas/LocationOption"
  /teacher-eligibility/test:
    get:
      summary: Get the active teacher eligibility test for a signed-in teacher
      responses:
        "200":
          description: Active eligibility test without answer scores
          content:
            application/json:
              schema:
                type: object
                required: [test]
                properties:
                  test:
                    $ref: "#/components/schemas/TeacherEligibilityTest"
        "401":
          description: Teacher is not signed in
        "403":
          description: Current account is not a teacher
        "404":
          description: No active test found
        "409":
          description: Teacher already passed the test
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
  /teacher-eligibility/submissions:
    post:
      summary: Submit teacher eligibility test answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherEligibilitySubmissionPayload"
      responses:
        "200":
          description: Eligibility attempt scored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherEligibilitySubmissionResponse"
        "400":
          description: Invalid, duplicate, or incomplete answers
        "401":
          description: Teacher is not signed in
        "403":
          description: Current account is not a teacher
        "404":
          description: Test not found
        "409":
          description: Teacher already passed the test
  /teachers/me/listing:
    get:
      summary: Get the signed-in teacher's eligibility and singular listing
      responses:
        "200":
          description: Teacher listing resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListingResource"
        "401":
          description: Teacher is not signed in
        "403":
          description: Current account is not a teacher
    put:
      summary: Create or update the signed-in teacher's singular listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherListingPayload"
      responses:
        "200":
          description: Teacher listing resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherListingResource"
        "400":
          description: Invalid listing payload
        "401":
          description: Teacher is not signed in
        "403":
          description: Current account is not a teacher
        "404":
          description: Location or lesson category not found
        "409":
          description: Listing write blocked by missing eligibility or suspended listing
  /teachers/{slug}:
    get:
      summary: Get a public teacher profile by slug
      parameters:
        - in: path
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public teacher profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherProfile"
        "404":
          description: Teacher profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /favorites/check:
    get:
      summary: Check if the signed-in student has favorited a teacher listing
      parameters:
        - in: query
          name: slug
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Favorite state
          content:
            application/json:
              schema:
                type: object
                required: [isFavorited]
                properties:
                  isFavorited:
                    type: boolean
  /favorites/toggle:
    post:
      summary: Toggle favorite state for a teacher listing (student only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
      responses:
        "200":
          description: New favorite state after toggle
          content:
            application/json:
              schema:
                type: object
                required: [isFavorited]
                properties:
                  isFavorited:
                    type: boolean
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a student account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Teacher listing not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
  /teachers/me/availability:
    get:
      summary: Get the signed-in teacher's weekly availability and exceptions
      responses:
        "200":
          description: Teacher availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAvailability"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a teacher account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Replace the signed-in teacher's weekly availability and exceptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherAvailability"
      responses:
        "200":
          description: Teacher availability saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAvailability"
        "400":
          description: Invalid availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a teacher account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teachers/me/calendar:
    get:
      summary: Get the signed-in teacher's lesson calendar
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Teacher calendar resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherCalendarResource"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a teacher account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teachers/me/calendar/lessons:
    post:
      summary: Create a manual lesson session for the signed-in teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarLessonPayload"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teachers/me/calendar/lessons/{id}:
    patch:
      summary: Update, reschedule, complete, or cancel a teacher lesson session
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalendarLessonPayload"
      responses:
        "200":
          description: Lesson updated
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
                    format: uuid
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profiles/me:
    patch:
      summary: Update the signed-in user's basic profile (name and phone)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone]
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 120
                phone:
                  type: string
                  minLength: 10
                  maxLength: 30
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                required: [fullName, phone]
                properties:
                  fullName:
                    type: string
                  phone:
                    type: string
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /teacher-profiles/me:
    patch:
      summary: Update the signed-in teacher's listing profile fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hourlyPrice, deliveryMode]
              properties:
                title:
                  type: string
                  maxLength: 200
                bio:
                  type: string
                  maxLength: 2000
                education:
                  type: string
                  maxLength: 300
                experienceYears:
                  type: integer
                  minimum: 0
                  maximum: 60
                hourlyPrice:
                  type: number
                  minimum: 0
                deliveryMode:
                  type: string
                  enum: [online, face_to_face, both]
      responses:
        "200":
          description: Teacher profile updated
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a teacher account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Teacher profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/teacher-profiles/{id}/status:
    post:
      summary: Update a teacher profile status (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [published, suspended, draft]
      responses:
        "200":
          description: Status updated
        "400":
          description: Invalid status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Teacher profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/reviews/{id}/status:
    post:
      summary: Update a review status (admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [published, rejected]
      responses:
        "200":
          description: Status updated
        "400":
          description: Invalid status payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Review not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reviews:
    post:
      summary: Submit a review for an accepted lesson request (student only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitReviewPayload"
      responses:
        "200":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitReviewResponse"
        "400":
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a student account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson request not found or not owned by student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request not accepted or review already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
  /lesson-requests/{id}/accept:
    post:
      summary: Accept a lesson request (teacher only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonRequestStatusResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a teacher account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request is not in submitted state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lesson-requests/{id}/reject:
    post:
      summary: Reject a lesson request (teacher only)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonRequestStatusResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a teacher account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Request is not in submitted state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /lesson-requests:
    post:
      summary: Submit a lesson request as the signed-in student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLessonRequestPayload"
      responses:
        "200":
          description: Lesson request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitLessonRequestResponse"
        "400":
          description: Invalid request payload or unsupported teacher/lesson/delivery choice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Student is not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Current account is not a student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Teacher, listing, lesson category, or location not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimitExceeded"
components:
  responses:
    RateLimitExceeded:
      description: Too many requests in the current time window
      headers:
        Retry-After:
          schema:
            type: string
        X-RateLimit-Remaining:
          schema:
            type: string
        X-RateLimit-Reset:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    PageParam:
      in: query
      name: page
      description: 1-based page number for list endpoints.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      in: query
      name: pageSize
      description: Number of records per page. List endpoints may choose a smaller default.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 12
    SearchQueryParam:
      in: query
      name: q
      description: Free-text search query.
      schema:
        type: string
    SortParam:
      in: query
      name: sort
      description: Endpoint-specific sort key.
      schema:
        type: string
    OrderParam:
      in: query
      name: order
      description: Sort direction for list endpoints that support generic ordering.
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    TeacherSortParam:
      in: query
      name: sort
      description: Teacher search sort key.
      schema:
        type: string
        enum: [recommended, nearest, highest_rated, lowest_price, most_reviewed]
        default: recommended
    LessonFilterParam:
      in: query
      name: lesson
      description: Lesson/category slug or search value.
      schema:
        type: string
    CityFilterParam:
      in: query
      name: city
      description: City filter.
      schema:
        type: string
    DistrictFilterParam:
      in: query
      name: district
      description: District filter.
      schema:
        type: string
    DeliveryModeFilterParam:
      in: query
      name: deliveryMode
      description: Online, face-to-face, or all delivery modes.
      schema:
        type: string
        enum: [all, online, face_to_face, both]
        default: all
  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    AuthRole:
      type: string
      enum: [student, teacher, admin]
    AuthAccount:
      type: object
      required: [id, role, fullName, phone, email]
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/AuthRole"
        fullName:
          type: string
        phone:
          type:
            - string
            - "null"
        email:
          type:
            - string
            - "null"
          format: email
    RegisterPayload:
      type: object
      required: [role, fullName, email, phone, password, termsAccepted, privacyAccepted]
      properties:
        role:
          type: string
          enum: [student, teacher]
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        password:
          type: string
          minLength: 8
        termsAccepted:
          type: boolean
          enum: [true]
        privacyAccepted:
          type: boolean
          enum: [true]
        next:
          type: string
    LoginPayload:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        next:
          type: string
    AuthResponse:
      type: object
      required: [account, redirectTo]
      properties:
        account:
          $ref: "#/components/schemas/AuthAccount"
        redirectTo:
          type: string
    LessonCategoryOption:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
    LocationOption:
      type: object
      required: [slug, city, district]
      properties:
